name: mcRPG
version: ${project.version}
description: >
    mcRPG is an RPG plugin based on mcMMO. Players pick a Primary and a Secondary
    Specialization from nineteen skills in six categories, and every other skill trains
    more slowly.
    mcRPG is a fork of mcMMO by nossr50 and the mcMMO team, released under GPLv3.

author: nossr50
authors: [ GJ, NuclearW, bm01, Glitchfinder, TfT_02, t00thpick1, Riking, electronicboy, kashike ]
website: https://github.com/jaymingxyz/mcRPG
main: com.gmail.nossr50.mcMMO
softdepend: [ WorldGuard, CombatTag, HealthBar, PlaceholderAPI, ViaVersion ]
load: POSTWORLD
folia-supported: true
api-version: 1.20.5

commands:
    # mcRPG: mcMMO's mc/mmo commands use an rpg prefix (see the design doc, section 12)
    rpgxpbar:
        description: Change XP bar settings
    rpgdebug:
        description: Toggles a debug mode which will print useful information to chat
    rpginfo:
        description: Info pages for mcRPG
        permission: mcrpg.commands.info
    mcrpg:
        description: Shows a brief mod description
        permission: mcrpg.commands.mcrpg
    rpgtop:
        description: Show mcRPG leader boards
        permission: mcrpg.commands.top
    rpgrank:
        description: Show mcRPG ranking for a player
        permission: mcrpg.commands.rank
    rpgaddxp:
        description: Add mcRPG XP to a user
        permission: mcrpg.commands.addxp
    rpgaddlevels:
        description: Add mcRPG levels to a user
        permission: mcrpg.commands.addlevels
    rpgability:
        description: Toggle whether abilities get readied on right click
        permission: mcrpg.commands.ability
    rpgrefresh:
        description: Refresh all cooldowns for mcRPG
        permission: mcrpg.commands.refresh
    rpgcooldowns:
        description: Show the cooldowns on all your mcRPG abilities
        permission: mcrpg.commands.cooldowns
    rpggod:
        description: Toggle mcRPG god-mode on/off
        permission: mcrpg.commands.god
    rpgstats:
        aliases: [ stats ]
        description: Shows your mcRPG stats and xp
        permission: mcrpg.commands.stats
    rpgremove:
        description: Remove a user from the database
        permission: mcrpg.commands.remove
    rpgsetlevel:
        description: Set the mcRPG skill level for a user
        permission: mcrpg.commands.setlevel
    rpginspect:
        description: View detailed mcRPG info on another player
        permission: mcrpg.commands.inspect
    rpgshowdb:
        description: Show the name of the current database type
        permission: mcrpg.commands.showdb
    rpgconvert:
        description: Convert between different database and formula types
        permission: mcrpg.commands.convert
    rpgskillreset:
        description: Reset the level of one or all of your skills
        permission: mcrpg.commands.skillreset
    excavation:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.excavation
    herbalism:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.herbalism
    mining:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.mining
    woodcutting:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.woodcutting
    axes:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.axes
    archery:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.archery
    crossbows:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.crossbows
    swords:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.swords
    taming:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.taming
    tridents:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.tridents
    unarmed:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.unarmed
    acrobatics:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.acrobatics
    repair:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.repair
    fishing:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.fishing
    smelting:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.smelting
    spears:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.spears
    alchemy:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.alchemy
    salvage:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.salvage
    maces:
        description: Detailed mcRPG skill info
        permission: mcrpg.commands.maces
    rpgpower:
        description: Shows skill mastery and power level info
        permission: mcrpg.commands.power
        aliases: [ powerlevel ]
    rpgpurge:
        description: Purge users with 0 powerlevel and/or who haven't connected in several months from the server DB.
        permission: mcrpg.commands.purge
    rpgnotify:
        description: Toggle mcRPG abilities chat display notifications on/off
        permission: mcrpg.commands.notify
    rpglevelupsound:
        description: Toggle the mcRPG level-up sound on/off
        permission: mcrpg.commands.levelupsound
    rpgscoreboard:
        aliases: [ rpgsb ]
        description: Manage your mcRPG Scoreboard
        permission: mcrpg.commands.scoreboard
    rpgreloadlocale:
        description: Reloads locale
        permission: mcrpg.commands.reloadlocale
    # mcRPG: Specializations
    chooseskill:
        description: Choose your Primary and Secondary Specializations
        permission: mcrpg.commands.chooseskill
    abandonskill:
        description: Abandon your Primary or Secondary Specialization
        permission: mcrpg.commands.abandonskill
    rpgsetskill:
        description: Set or clear a player's Primary or Secondary Specialization
        permission: mcrpg.commands.setskill
permissions:
    # mcRPG: Specializations
    mcrpg.commands.chooseskill:
        default: true
        description: Allows choosing your Primary and Secondary skills
    mcrpg.commands.abandonskill:
        default: true
        description: Allows abandoning your Primary or Secondary skill
    mcrpg.commands.setskill:
        default: op
        description: Allows setting or clearing any player's Primary or Secondary skill
    #mcrpg.defaults is the intended default permission, give this to your players for the intended experience
    mcrpg.defaults:
        default: true
        description: mcRPG permisions that default to true
        children:
            mcrpg.commands.defaults: true
            mcrpg.motd: true
            mcrpg.skills.all: true
            mcrpg.broadcast.levelup: true
    mcrpg.defaultsop:
        default: op
        description: mcRPG permissions that default to op
        children:
            mcrpg.commands.defaultsop: true
            mcrpg.item.all: true
            mcrpg.tools.all: true
    mcrpg.*:
        default: false
        description: Implies all mcRPG permissions.
        children:
            mcrpg.all: true
    mcrpg.all:
        default: false
        description: Implies all mcRPG permissions.
        children:
            mcrpg.admin: true
            mcrpg.bypass.all: true
            mcrpg.commands.all: true
            mcrpg.defaults: true
            mcrpg.defaultsop: true
            mcrpg.perks.all: true
    mcrpg.broadcast.levelup:
        description: when the player reaches certain level milestones their achievement will be broadcast in chat to other plays
